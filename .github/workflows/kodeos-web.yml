name: Build KodeOS WebAssembly simulator
on:
  workflow_dispatch:
  push:
    branches: [kodeos-web-simulator]
    paths:
      - '.github/workflows/kodeos-web.yml'
      - 'kodeos-web/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: kodeos-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'
      - name: Clone original KodeOS and kode-sdk
        run: |
          git clone --depth 1 https://github.com/kodediy/KodeOS.git upstream
          git clone --depth 1 https://github.com/kodediy/kode-sdk.git upstream/sdk
          cp kodeos-web/CMakeLists.txt upstream/components/kgui/sim/CMakeLists.txt
          cp kodeos-web/build-web.sh upstream/build-web.sh
          chmod +x upstream/build-web.sh
      - name: Adapt SDL2 detection for Emscripten
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/sdk/components/kui/sim/CMakeLists.txt')
          s = p.read_text()
          old = 'find_package(PkgConfig REQUIRED)\npkg_check_modules(SDL2 REQUIRED IMPORTED_TARGET sdl2)'
          new = '''if(EMSCRIPTEN)
              add_library(kui_emscripten_sdl2 INTERFACE)
              add_library(PkgConfig::SDL2 ALIAS kui_emscripten_sdl2)
              target_compile_options(kui_emscripten_sdl2 INTERFACE "-sUSE_SDL=2")
              target_link_options(kui_emscripten_sdl2 INTERFACE "-sUSE_SDL=2")
          else()
              find_package(PkgConfig REQUIRED)
              pkg_check_modules(SDL2 REQUIRED IMPORTED_TARGET sdl2)
          endif()'''
          assert old in s, 'SDK SDL2 detection changed upstream'
          p.write_text(s.replace(old,new))
          PY
      - name: Provide ESP-IDF configuration compatibility header
        run: |
          mkdir -p upstream/web-compat
          cat > upstream/web-compat/sdkconfig.h <<'EOF'
          #pragma once
          /* Web simulator: ESP-IDF-only optional features are disabled.
             This is not a replacement for the hardware SDK. */
          #define CONFIG_KQP_AO_WATCH 0
          EOF
      - name: Add desktop-only launcher adapter
        run: |
          cp kodeos-web/launcher_sim.c upstream/web-compat/launcher_sim.c
      - name: Build WebAssembly
        run: bash upstream/build-web.sh
      - name: Prepare GitHub Pages
        if: success()
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: upstream/dist/
      - name: Upload browser build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kodeos-browser-wasm
          path: upstream/dist/
  deploy:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy KodeOS browser simulator
        id: deployment
        uses: actions/deploy-pages@v4
